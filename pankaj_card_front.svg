<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="1050" height="600">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <!-- Metallic Accent Gradient -->
    <linearGradient id="cyanMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Subtle Mesh Pattern -->
    <radialGradient id="meshRadial" cx="85%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="meshRadial2" cx="15%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <!-- Box Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1050" height="600" rx="24" fill="url(#cardBg)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2"/>
  <rect width="1050" height="600" rx="24" fill="url(#meshRadial)"/>
  <rect width="1050" height="600" rx="24" fill="url(#meshRadial2)"/>

  <!-- Top Decorative Circuit Hairline -->
  <path d="M 60 70 L 320 70 L 360 110 L 990 110" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" fill="none"/>
  <circle cx="360" cy="110" r="3.5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="990" cy="110" r="3.5" fill="#38bdf8"/>

    <!-- Official Pixel Bite Logo Emblem -->
  <g transform="translate(60, 50)">
    <rect width="72" height="72" rx="16" fill="#04060a" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    <g transform="translate(36, 44) scale(0.18)">
      <circle cx="10" cy="-20" r="95" fill="#0284c7" opacity="0.3"/>
      <path d="M -120 48 L 105 48 A 48 48 0 0 0 130 -32 A 62 62 0 0 0 20 -115 A 75 75 0 0 0 -105 -48 A 48 48 0 0 0 -120 48 Z" fill="url(#cyanMetallic)"/>
      <g transform="translate(68, -75) rotate(22)"><rect x="-20" y="-20" width="40" height="40" rx="6" fill="#04060a"/></g>
      <g transform="translate(122, -112) rotate(22)"><rect x="-17" y="-17" width="34" height="34" rx="8" fill="#00f0ff" stroke="#fff" stroke-width="3"/></g>
    </g>
  </g>

  <!-- Brand Title & Tagline -->
  <text x="150" y="86" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="34" fill="#ffffff" letter-spacing="-0.5">PixelTo<tspan fill="#38bdf8">Cloud</tspan></text>
  <text x="150" y="112" font-family="'Fira Code', monospace" font-weight="600" font-size="14" fill="#94a3b8" letter-spacing="2">ARCHITECTURAL SOFTWARE &amp; CLOUD SYSTEMS</text>

  <!-- Top Right Enterprise Badge -->
  <g transform="translate(800, 56)">
    <rect width="190" height="34" rx="17" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
    <circle cx="18" cy="17" r="4.5" fill="#10b981"/>
    <text x="32" y="22" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">SYSTEMS ARCHITECT</text>
  </g>

  <!-- Founder Name & Title Section -->
  <g transform="translate(60, 210)">
    <text x="0" y="40" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="-0.8">Pankaj Gupta</text>
    <text x="0" y="74" font-family="'Fira Code', monospace" font-weight="600" font-size="18" fill="#38bdf8" letter-spacing="0.5">Founder &amp; Principal Systems Architect</text>
    <text x="0" y="104" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#94a3b8">8–10+ Years Hardware Engineering &amp; Full-Stack Cloud Architecture</text>
  </g>

  <!-- Divider Line -->
  <line x1="60" y1="365" x2="990" y2="365" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Contact Credentials & Direct Actions -->
  <g transform="translate(60, 400)">
    <!-- Direct Call / WhatsApp -->
    <g transform="translate(0, 25)">
      <circle cx="16" cy="0" r="16" fill="rgba(37, 211, 102, 0.15)" stroke="#25d366" stroke-width="1"/>
      <path d="M 11 -5 L 14 -3 L 13 1 C 14 3, 16 5, 18 6 L 22 5 L 24 8 C 24 10, 21 12, 19 11 C 14 9, 10 5, 8 0 C 7 -2, 9 -5, 11 -5 Z" fill="#25d366"/>
      <text x="46" y="6" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#ffffff">+91 82193 52124 <tspan font-size="14" font-weight="500" fill="#94a3b8">(Call / WhatsApp)</tspan></text>
    </g>

    <!-- Direct Email -->
    <g transform="translate(0, 75)">
      <circle cx="16" cy="0" r="16" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
      <rect x="9" y="-6" width="14" height="11" rx="2" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M 9 -5 L 16 0 L 23 -5" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
      <text x="46" y="6" font-family="'Inter', sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">pixeltocloud@gmail.com</text>
    </g>

    <!-- Website & Global Edge -->
    <g transform="translate(0, 125)">
      <circle cx="16" cy="0" r="16" fill="rgba(129, 140, 248, 0.15)" stroke="#818cf8" stroke-width="1"/>
      <circle cx="16" cy="0" r="7" fill="none" stroke="#818cf8" stroke-width="1.5"/>
      <line x1="9" y1="0" x2="23" y2="0" stroke="#818cf8" stroke-width="1.5"/>
      <text x="46" y="6" font-family="'Fira Code', monospace" font-size="18" font-weight="700" fill="#38bdf8">https://pixeltocloud.com</text>
    </g>
  </g>

  <!-- Right Scannable QR Code Box -->
  <g transform="translate(830, 395)">
    <!-- QR Card Container -->
    <rect width="160" height="160" rx="16" fill="#ffffff" stroke="rgba(56, 189, 248, 0.5)" stroke-width="2" filter="url(#glow)"/>
    
    <!-- High Contrast Clean Vector QR Code Representation for pixeltocloud.com -->
    <g transform="translate(18, 18) scale(0.95)">
      <!-- Corner Markers Top Left -->
      <rect x="0" y="0" width="38" height="38" rx="4" fill="#080c14"/>
      <rect x="7" y="7" width="24" height="24" rx="2" fill="#ffffff"/>
      <rect x="13" y="13" width="12" height="12" rx="1" fill="#080c14"/>

      <!-- Corner Markers Top Right -->
      <rect x="94" y="0" width="38" height="38" rx="4" fill="#080c14"/>
      <rect x="101" y="7" width="24" height="24" rx="2" fill="#ffffff"/>
      <rect x="107" y="13" width="12" height="12" rx="1" fill="#080c14"/>

      <!-- Corner Markers Bottom Left -->
      <rect x="0" y="94" width="38" height="38" rx="4" fill="#080c14"/>
      <rect x="7" y="101" width="24" height="24" rx="2" fill="#ffffff"/>
      <rect x="13" y="107" width="12" height="12" rx="1" fill="#080c14"/>

      <!-- Data Dots -->
      <rect x="46" y="6" width="8" height="8" fill="#080c14"/>
      <rect x="62" y="6" width="16" height="8" fill="#080c14"/>
      <rect x="46" y="22" width="12" height="8" fill="#080c14"/>
      <rect x="72" y="22" width="10" height="12" fill="#080c14"/>
      <rect x="46" y="46" width="40" height="40" rx="4" fill="#00d2ff"/>
      <text x="66" y="71" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" fill="#050b14" text-anchor="middle">P2C</text>
      <rect x="6" y="52" width="12" height="8" fill="#080c14"/>
      <rect x="24" y="66" width="14" height="8" fill="#080c14"/>
      <rect x="96" y="52" width="12" height="12" fill="#080c14"/>
      <rect x="114" y="68" width="14" height="10" fill="#080c14"/>
      <rect x="46" y="96" width="14" height="14" fill="#080c14"/>
      <rect x="70" y="102" width="18" height="10" fill="#080c14"/>
      <rect x="96" y="96" width="10" height="22" fill="#080c14"/>
      <rect x="114" y="112" width="16" height="14" fill="#080c14"/>
    </g>
    <text x="80" y="152" font-family="'Fira Code', monospace" font-size="10" font-weight="700" fill="#080c14" text-anchor="middle" letter-spacing="0.5">SCAN FOR WEBSITE</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="l7Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080e" />
      <stop offset="100%" stop-color="#0a1224" />
    </linearGradient>
    <linearGradient id="l7Neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="l7Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" rx="36" fill="url(#l7Bg)" />

  <!-- Cloud Canopy composed of Isometric Pixels -->
  <g transform="translate(400, 350)">
    <!-- Base Layer -->
    <g fill="url(#l7Neon)" filter="url(#l7Glow)">
      <!-- Central Cloud Crest -->
      <circle cx="0" cy="-60" r="55"/>
      <circle cx="-65" cy="-25" r="45"/>
      <circle cx="65" cy="-25" r="45"/>
      <circle cx="-110" cy="20" r="35"/>
      <circle cx="110" cy="20" r="35"/>
      <rect x="-110" y="-10" width="220" height="65" rx="10"/>
    </g>

    <!-- Dissolving Isometric Pixel Shards beneath -->
    <g fill="#00f0ff">
      <polygon points="-80,85 -60,75 -60,95 -80,105" opacity="0.9"/>
      <polygon points="-40,95 -20,85 -20,105 -40,115" opacity="0.8"/>
      <polygon points="0,80 20,70 20,90 0,100" opacity="0.95"/>
      <polygon points="40,100 60,90 60,110 40,120" opacity="0.75"/>
      <polygon points="80,85 100,75 100,95 80,105" opacity="0.85"/>
      <polygon points="-20,130 0,120 0,140 -20,150" opacity="0.6"/>
      <polygon points="20,135 40,125 40,145 20,155" opacity="0.5"/>
    </g>

    <!-- Central Micro Monogram -->
    <text x="0" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="36" fill="#05070c" text-anchor="middle" letter-spacing="-1">P2C</text>
  </g>

  <!-- Typography -->
  <text x="400" y="620" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="-1">PixelTo<tspan fill="#38bdf8">Cloud</tspan></text>
  <text x="400" y="665" font-family="'Fira Code', monospace" font-weight="600" font-size="18" fill="#94a3b8" text-anchor="middle" letter-spacing="4">2D/3D WEB &amp; CLOUD SYSTEMS</text>
</svg>
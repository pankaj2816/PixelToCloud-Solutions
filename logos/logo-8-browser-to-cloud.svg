<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="l8Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="100%" stop-color="#0b1324" />
    </linearGradient>
    <linearGradient id="l8Cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="l8CloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="l8Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" rx="36" fill="url(#l8Bg)" />

  <!-- Main Illustration -->
  <g transform="translate(400, 340)">
    <!-- Browser Window (Lower Part) -->
    <rect x="-160" y="-30" width="320" height="190" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2.5"/>
    <path d="M -160 12 L 160 12" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>
    
    <!-- Browser Controls -->
    <circle cx="-135" cy="-9" r="5" fill="#ef4444"/>
    <circle cx="-118" cy="-9" r="5" fill="#f59e0b"/>
    <circle cx="-101" cy="-9" r="5" fill="#10b981"/>
    
    <!-- Browser URL Bar -->
    <rect x="-70" y="-18" width="180" height="18" rx="6" fill="rgba(255, 255, 255, 0.08)"/>
    <text x="20" y="-5" font-family="'Fira Code', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">pixeltocloud.com</text>

    <!-- Browser Inner Elements (Website Mockup) -->
    <rect x="-135" y="30" width="120" height="12" rx="4" fill="rgba(56, 189, 248, 0.3)"/>
    <rect x="-135" y="52" width="160" height="8" rx="3" fill="rgba(255, 255, 255, 0.15)"/>
    <rect x="-135" y="68" width="130" height="8" rx="3" fill="rgba(255, 255, 255, 0.1)"/>
    
    <!-- Pixels Emerging from Browser -->
    <rect x="-40" y="86" width="24" height="24" rx="5" fill="url(#l8Cyan)" filter="url(#l8Glow)"/>
    <rect x="-8" y="100" width="20" height="20" rx="4" fill="#00f0ff"/>
    <rect x="22" y="90" width="22" height="22" rx="4" fill="url(#l8Cyan)"/>
    <rect x="54" y="98" width="20" height="20" rx="4" fill="#818cf8"/>

    <!-- Emerging Cloud (Floating on Top of Browser) -->
    <g transform="translate(0, -65)" filter="url(#l8Glow)">
      <path d="M -90 30 L 90 30 A 45 45 0 0 0 100 -40 A 55 55 0 0 0 10 -95 A 65 65 0 0 0 -95 -45 A 45 45 0 0 0 -90 30 Z" 
            fill="url(#l8CloudGrad)"/>
      <path d="M -75 22 L 75 22 A 38 38 0 0 0 85 -35 A 46 46 0 0 0 10 -80 A 55 55 0 0 0 -80 -38 A 38 38 0 0 0 -75 22 Z" 
            fill="#060911" opacity="0.9"/>
      <!-- Code Brackets inside Cloud -->
      <text x="0" y="-12" font-family="'Fira Code', monospace" font-weight="800" font-size="34" fill="#00f0ff" text-anchor="middle">&lt; / &gt;</text>
    </g>
  </g>

  <!-- Typography -->
  <text x="400" y="620" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="-1">PixelTo<tspan fill="#38bdf8">Cloud</tspan></text>
  <text x="400" y="665" font-family="'Fira Code', monospace" font-weight="600" font-size="18" fill="#94a3b8" text-anchor="middle" letter-spacing="3">WEBSITE DEVELOPMENT &amp; CLOUD HOSTING</text>
</svg>
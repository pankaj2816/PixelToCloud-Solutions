<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="l5Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d" />
      <stop offset="100%" stop-color="#0a101f" />
    </linearGradient>
    <linearGradient id="l5HexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="l5Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" rx="36" fill="url(#l5Bg)" />

  <!-- Outer Hexagon Frame -->
  <g transform="translate(400, 360)">
    <polygon points="0,-180 156,-90 156,90 0,180 -156,90 -156,-90" 
             fill="none" stroke="url(#l5HexGrad)" stroke-width="6" filter="url(#l5Glow)"/>
    <polygon points="0,-165 142,-82 142,82 0,165 -142,82 -142,-82" 
             fill="rgba(14, 20, 35, 0.7)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

    <!-- Central Cloud Made of Connected Geometric Data Nodes -->
    <path d="M -70 50 L 70 50 A 30 30 0 0 0 85 -5 A 40 40 0 0 0 20 -60 A 50 50 0 0 0 -60 -25 A 35 35 0 0 0 -70 50 Z" 
          fill="url(#l5HexGrad)" opacity="0.95" filter="url(#l5Glow)"/>
    <circle cx="-35" cy="50" r="7" fill="#ffffff"/>
    <circle cx="35" cy="50" r="7" fill="#ffffff"/>
    <circle cx="85" cy="15" r="7" fill="#ffffff"/>
    <circle cx="20" cy="-60" r="8" fill="#38bdf8"/>
    <circle cx="-60" cy="-25" r="7" fill="#ffffff"/>
    <circle cx="0" cy="0" r="10" fill="#00f0ff" filter="url(#l5Glow)"/>
  </g>

  <!-- Typography -->
  <text x="400" y="620" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="-1">PixelTo<tspan fill="#38bdf8">Cloud</tspan></text>
  <text x="400" y="665" font-family="'Fira Code', monospace" font-weight="600" font-size="18" fill="#94a3b8" text-anchor="middle" letter-spacing="4">ENTERPRISE SOFTWARE STUDIO</text>
</svg>
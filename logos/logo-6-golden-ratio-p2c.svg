<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="l6Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#0d1322" />
    </linearGradient>
    <linearGradient id="l6Cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="l6Emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="l6Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" rx="36" fill="url(#l6Bg)" />

  <!-- Monogram Interlocking Mark -->
  <g transform="translate(400, 360)">
    <!-- Letter P -->
    <path d="M -120 120 L -120 -120 L -40 -120 C 10 -120, 30 -100, 30 -60 C 30 -20, 10 0, -40 0 L -80 0 L -80 120 Z" 
          fill="url(#l6Cyan)" filter="url(#l6Glow)"/>
    <path d="M -80 -80 L -40 -80 C -15 -80, -5 -70, -5 -60 C -5 -50, -15 -40, -40 -40 L -80 -40 Z" fill="#07090e"/>

    <!-- Digit 2 & Letter C Integrated Cloud Loop -->
    <path d="M 0 0 C 40 -80, 120 -80, 130 -10 C 140 50, 60 80, 20 120 L 140 120 L 140 80 L 70 80 C 95 55, 115 35, 110 -5 C 105 -50, 50 -55, 20 -10 Z" 
          fill="#ffffff" opacity="0.95"/>
    <!-- Outer Cloud Arc embracing the monogram -->
    <path d="M -140 -80 A 130 130 0 0 1 150 -60 A 100 100 0 0 1 150 130" 
          fill="none" stroke="url(#l6Emerald)" stroke-width="8" stroke-dasharray="12 8" filter="url(#l6Glow)"/>
  </g>

  <!-- Typography -->
  <text x="400" y="620" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="-1">PixelTo<tspan fill="#38bdf8">Cloud</tspan></text>
  <text x="400" y="665" font-family="'Fira Code', monospace" font-weight="600" font-size="18" fill="#94a3b8" text-anchor="middle" letter-spacing="4">HIGH-PERFORMANCE SOLUTIONS</text>
</svg>
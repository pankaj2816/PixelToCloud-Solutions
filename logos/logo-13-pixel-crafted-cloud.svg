<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="l13Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c" />
      <stop offset="100%" stop-color="#0d1424" />
    </linearGradient>
    <linearGradient id="l13Cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="l13Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" rx="36" fill="url(#l13Bg)" />

  <g transform="translate(400, 350)">
    <!-- Crisp Modern Cloud Outline -->
    <path d="M -130 35 L 130 35 A 50 50 0 0 0 145 -35 A 65 65 0 0 0 30 -110 A 75 75 0 0 0 -115 -50 A 55 55 0 0 0 -130 35 Z" 
          fill="rgba(13, 20, 35, 0.85)" stroke="url(#l13Cyan)" stroke-width="8" filter="url(#l13Glow)"/>

    <!-- Bottom Pixel Building Blocks (Lifting from ground to cloud) -->
    <g fill="#38bdf8">
      <!-- Pixel Steps -->
      <rect x="-100" y="60" width="25" height="25" rx="5" opacity="0.6"/>
      <rect x="-65" y="60" width="25" height="25" rx="5" opacity="0.8"/>
      <rect x="-30" y="60" width="25" height="25" rx="5" />
      <rect x="5" y="60" width="25" height="25" rx="5" />
      <rect x="40" y="60" width="25" height="25" rx="5" opacity="0.8"/>
      <rect x="75" y="60" width="25" height="25" rx="5" opacity="0.6"/>

      <!-- Second Pixel Row -->
      <rect x="-65" y="92" width="25" height="25" rx="5" opacity="0.5"/>
      <rect x="-30" y="92" width="25" height="25" rx="5" opacity="0.7"/>
      <rect x="5" y="92" width="25" height="25" rx="5" opacity="0.7"/>
      <rect x="40" y="92" width="25" height="25" rx="5" opacity="0.5"/>
    </g>

    <!-- Upward Growth Arrow from Pixels to Cloud -->
    <path d="M 0 50 L 0 -40 M -18 -22 L 0 -45 L 18 -22" 
          stroke="#00f0ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#l13Glow)"/>
  </g>

  <!-- Typography -->
  <text x="400" y="620" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="-1">PixelTo<tspan fill="#38bdf8">Cloud</tspan></text>
  <text x="400" y="665" font-family="'Fira Code', monospace" font-weight="600" font-size="18" fill="#94a3b8" text-anchor="middle" letter-spacing="3">FROM PIXEL CRAFT TO CLOUD SCALE</text>
</svg>
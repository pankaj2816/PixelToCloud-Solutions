<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="gE_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="800" height="800" rx="40" fill="#07090e" />

  <!-- Cloud resting on 3 ascending vertical server pillars -->
  <g transform="translate(400, 330)">
    <!-- Minimalist Cloud Contour -->
    <path d="M -115 15 L 115 15 A 45 45 0 0 0 130 -50 A 60 60 0 0 0 20 -120 A 75 75 0 0 0 -100 -55 A 50 50 0 0 0 -115 15 Z" 
          fill="none" stroke="url(#gE_1)" stroke-width="18" stroke-linejoin="round"/>
    
    <!-- Three Rising Data Pillars (Pixel to Cloud Scale) -->
    <rect x="-60" y="-10" width="20" height="65" rx="10" fill="#0284c7"/>
    <rect x="-10" y="-35" width="20" height="90" rx="10" fill="#38bdf8"/>
    <rect x="40" y="-55" width="20" height="110" rx="10" fill="#00f0ff"/>
  </g>

  <text x="400" y="580" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="800" font-size="54" fill="#ffffff" text-anchor="middle" letter-spacing="-1">PixelTo<tspan fill="#38bdf8">Cloud</tspan></text>
  <text x="400" y="625" font-family="'Inter', sans-serif" font-weight="600" font-size="16" fill="#64748b" text-anchor="middle" letter-spacing="5">CLOUD INFRASTRUCTURE &amp; DEV</text>
</svg>
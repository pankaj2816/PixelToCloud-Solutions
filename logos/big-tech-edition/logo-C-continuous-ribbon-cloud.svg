<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="gC_Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="800" height="800" rx="40" fill="#07090e" />

  <!-- Single Continuous Minimalist Path forming a Cloud with internal fold -->
  <g transform="translate(400, 330)">
    <path d="M -110 40 
             L 100 40 
             A 45 45 0 0 0 115 -35 
             A 55 55 0 0 0 15 -100 
             A 65 65 0 0 0 -95 -45 
             A 45 45 0 0 0 -110 40 Z" 
          fill="none" stroke="url(#gC_Grad)" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Precision Core Fold: A sharp inward loop -->
    <path d="M -30 40 Q 0 -15 30 40" fill="none" stroke="url(#gC_Grad)" stroke-width="20" stroke-linecap="round"/>
  </g>

  <text x="400" y="580" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="800" font-size="54" fill="#ffffff" text-anchor="middle" letter-spacing="-1">PixelTo<tspan fill="#38bdf8">Cloud</tspan></text>
  <text x="400" y="625" font-family="'Inter', sans-serif" font-weight="600" font-size="16" fill="#64748b" text-anchor="middle" letter-spacing="5">SOFTWARE &amp; ARCHITECTURE</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="l12Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060912" />
      <stop offset="100%" stop-color="#0a1226" />
    </linearGradient>
    <linearGradient id="l12Cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="l12Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" rx="36" fill="url(#l12Bg)" />

  <g transform="translate(400, 340)">
    <!-- Desktop Monitor Silhouette -->
    <rect x="-140" y="-60" width="190" height="125" rx="10" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="3"/>
    <!-- Monitor Stand -->
    <rect x="-55" y="65" width="20" height="30" fill="#38bdf8"/>
    <rect x="-75" y="95" width="60" height="8" rx="4" fill="#38bdf8"/>

    <!-- Smartphone Silhouette overlapping right -->
    <rect x="40" y="-20" width="85" height="145" rx="14" fill="#060912" stroke="#ffffff" stroke-width="3" filter="url(#l12Glow)"/>
    <!-- Phone Screen Elements -->
    <line x1="55" y1="0" x2="110" y2="0" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <rect x="55" y="15" width="22" height="22" rx="4" fill="rgba(56, 189, 248, 0.4)"/>
    <rect x="85" y="15" width="22" height="22" rx="4" fill="rgba(56, 189, 248, 0.4)"/>
    <circle cx="82" cy="110" r="5" fill="#94a3b8"/>

    <!-- Central Floating Cloud with Sync Arrows -->
    <g transform="translate(-10, -85)">
      <path d="M -70 25 L 70 25 A 35 35 0 0 0 80 -25 A 45 45 0 0 0 10 -75 A 50 50 0 0 0 -65 -30 A 35 35 0 0 0 -70 25 Z" 
            fill="url(#l12Cyan)" filter="url(#l12Glow)"/>
      <!-- Cloud Sync Circular Arrow Icon -->
      <path d="M -15 -18 A 18 18 0 1 1 15 -10" fill="none" stroke="#05070d" stroke-width="4" stroke-linecap="round"/>
      <polygon points="12,-20 22,-10 12,0" fill="#05070d"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="400" y="620" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="-1">PixelTo<tspan fill="#38bdf8">Cloud</tspan></text>
  <text x="400" y="665" font-family="'Fira Code', monospace" font-weight="600" font-size="18" fill="#94a3b8" text-anchor="middle" letter-spacing="3">RESPONSIVE WEB &amp; CLOUD SYSTEMS</text>
</svg>
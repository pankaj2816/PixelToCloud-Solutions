<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="v4_Cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="v4_Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" rx="40" fill="#05070c" />

  <g transform="translate(400, 325)">
    <!-- 22px Precision White Contour Cloud with Gap on Right Shoulder -->
    <path d="M -115 45 
             L 105 45 
             A 46 46 0 0 0 125 -30 
             M 110 -65 
             M 45 -105 
             A 62 62 0 0 0 18 -112 
             A 72 72 0 0 0 -100 -45 
             A 46 46 0 0 0 -115 45 Z" 
          fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Negative Space Notched Square at the Gap -->
    <g transform="translate(75, -82) rotate(22)">
      <rect x="-18" y="-18" width="36" height="36" rx="7" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="3" stroke-dasharray="6 4"/>
    </g>

    <!-- The Emancipated Solid Cyan Pixel Floating Free -->
    <g transform="translate(125, -118) rotate(22)" filter="url(#v4_Glow)">
      <rect x="-16" y="-16" width="32" height="32" rx="7" fill="url(#v4_Cyan)"/>
      <circle cx="0" cy="0" r="5" fill="#ffffff"/>
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(400, 580)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-weight="800" font-size="54" fill="#ffffff" text-anchor="middle" letter-spacing="-1.5">
      PixelTo<tspan fill="#38bdf8">Cloud</tspan>
    </text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-weight="600" font-size="15" fill="#64748b" text-anchor="middle" letter-spacing="4">
      ENTERPRISE SYSTEMS STUDIO
    </text>
  </g>
</svg>
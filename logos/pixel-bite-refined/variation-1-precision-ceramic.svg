<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="v1_PixelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="v1_Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" rx="40" fill="#000000" />

  <!-- The Icon -->
  <g transform="translate(400, 325)">
    <!-- Golden Ratio Pure Cloud Silhouette (Matte Ceramic White) -->
    <path d="M -120 48 
             L 105 48 
             A 48 48 0 0 0 130 -32 
             A 62 62 0 0 0 20 -115 
             A 75 75 0 0 0 -105 -48 
             A 48 48 0 0 0 -120 48 Z" 
          fill="#ffffff"/>

    <!-- Laser-cut Precision Pixel Bite Notch on Upper-Right Arc -->
    <g transform="translate(68, -75) rotate(22)">
      <rect x="-20" y="-20" width="40" height="40" rx="6" fill="#000000"/>
    </g>

    <!-- The Floating Cyan Pixel Leaf (Elegantly Ascending) -->
    <g transform="translate(118, -108) rotate(22)" filter="url(#v1_Glow)">
      <rect x="-16" y="-16" width="32" height="32" rx="7" fill="url(#v1_PixelGrad)"/>
      <rect x="-16" y="-16" width="32" height="32" rx="7" fill="none" stroke="rgba(255, 255, 255, 0.6)" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Typography: Custom Apple-tier layout with square 'i' dot -->
  <g transform="translate(400, 580)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="54" fill="#ffffff" text-anchor="middle" letter-spacing="-1.5">
      PixelTo<tspan fill="#38bdf8">Cloud</tspan>
    </text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-weight="600" font-size="15" fill="#71717a" text-anchor="middle" letter-spacing="4">
      ARCHITECTURAL SOFTWARE &amp; SYSTEMS
    </text>
  </g>
</svg>
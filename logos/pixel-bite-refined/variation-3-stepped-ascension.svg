<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="v3_Cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="v3_Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" rx="40" fill="#000000" />

  <g transform="translate(400, 325)">
    <!-- Solid Pure White Cloud -->
    <path d="M -120 48 L 105 48 A 48 48 0 0 0 130 -32 A 62 62 0 0 0 20 -115 A 75 75 0 0 0 -105 -48 A 48 48 0 0 0 -120 48 Z" fill="#ffffff"/>

    <!-- Stepped Dual Pixel Bite Cutout -->
    <rect x="65" y="-90" width="34" height="34" rx="5" fill="#000000"/>
    <rect x="85" y="-60" width="26" height="26" rx="4" fill="#000000"/>

    <!-- Dual Ascending Cyan Pixels -->
    <rect x="110" y="-120" width="28" height="28" rx="6" fill="url(#v3_Cyan)" filter="url(#v3_Glow)"/>
    <rect x="142" y="-95" width="20" height="20" rx="4" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Typography -->
  <g transform="translate(400, 580)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-weight="800" font-size="54" fill="#ffffff" text-anchor="middle" letter-spacing="-1.5">
      PixelTo<tspan fill="#38bdf8">Cloud</tspan>
    </text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-weight="600" font-size="15" fill="#71717a" text-anchor="middle" letter-spacing="4">
      FROM PIXEL CRAFT TO CLOUD SCALE
    </text>
  </g>
</svg>
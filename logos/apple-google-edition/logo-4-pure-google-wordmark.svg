<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" rx="40" fill="#000000" />

  <!-- Minimalist Cloud Monogram Mark on Top -->
  <g transform="translate(400, 270)">
    <path d="M -80 35 L 80 35 A 35 35 0 0 0 95 -20 A 48 48 0 0 0 15 -80 A 55 55 0 0 0 -70 -30 A 35 35 0 0 0 -80 35 Z" 
          fill="#38bdf8"/>
    <!-- Negative Space Cutout Dot -->
    <rect x="-10" y="-15" width="20" height="20" rx="5" fill="#000000"/>
  </g>

  <!-- Google-Style Bold Friendly Wordmark -->
  <g transform="translate(400, 470)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="68" fill="#ffffff" text-anchor="middle" letter-spacing="-1.5">
      pixel<tspan fill="#38bdf8">to</tspan>cloud
    </text>
    <text x="0" y="45" font-family="'Inter', sans-serif" font-weight="600" font-size="17" fill="#64748b" text-anchor="middle" letter-spacing="5">
      SOLUTIONS
    </text>
  </g>
</svg>
  <text x="400" y="580" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="700" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">
    <tspan fill="#4285F4">P</tspan><tspan fill="#EA4335">i</tspan><tspan fill="#FBBC05">x</tspan><tspan fill="#4285F4">e</tspan><tspan fill="#34A853">l</tspan><tspan fill="#ffffff">To</tspan><tspan fill="#4285F4">C</tspan><tspan fill="#EA4335">l</tspan><tspan fill="#FBBC05">o</tspan><tspan fill="#4285F4">u</tspan><tspan fill="#34A853">d</tspan>
  </text>
  <text x="400" y="625" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="16" fill="#94a3b8" text-anchor="middle" letter-spacing="3">TECHNOLOGY &amp; CLOUD</text>
</svg>
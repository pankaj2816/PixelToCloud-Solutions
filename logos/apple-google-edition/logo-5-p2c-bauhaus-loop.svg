<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" rx="40" fill="#05070c" />

  <g transform="translate(400, 330)">
    <!-- Unbroken Line Art: Letter P into Cloud into Letter C -->
    <path d="M -80 50 L -80 -70 L -30 -70 A 35 35 0 0 1 -30 0 L -80 0 
             M -30 0 
             C 10 -40, 50 -80, 80 -40 
             C 110 0, 90 50, 40 50 
             L -30 50" 
          fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Electric Cyan Accent Terminal -->
    <circle cx="40" cy="50" r="11" fill="#38bdf8"/>
  </g>

  <text x="400" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="-1">PixelTo<tspan fill="#38bdf8">Cloud</tspan></text>
  <text x="400" y="625" font-family="'Inter', sans-serif" font-weight="600" font-size="16" fill="#71717a" text-anchor="middle" letter-spacing="4">DIGITAL CRAFT &amp; CLOUD</text>
</svg>
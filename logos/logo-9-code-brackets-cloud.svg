<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="l9Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#091022" />
    </linearGradient>
    <linearGradient id="l9Cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="l9Purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="l9Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" rx="36" fill="url(#l9Bg)" />

  <!-- Code Brackets Forming the Cloud -->
  <g transform="translate(400, 350)">
    <!-- Cloud Silhouette Ambient Glow -->
    <path d="M -130 60 L 130 60 A 55 55 0 0 0 150 -35 A 65 65 0 0 0 25 -115 A 80 80 0 0 0 -125 -55 A 60 60 0 0 0 -130 60 Z" 
          fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4" stroke-dasharray="8 6"/>

    <!-- Left Opening Bracket '<' morphing into Cloud -->
    <path d="M -40 -90 L -120 -20 L -40 50" 
          fill="none" stroke="url(#l9Cyan)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#l9Glow)"/>

    <!-- Right Closing Bracket '>' morphing into Cloud -->
    <path d="M 40 -90 L 120 -20 L 40 50" 
          fill="none" stroke="url(#l9Cyan)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#l9Glow)"/>

    <!-- Center Slash '/' with Pixel Nodes -->
    <line x1="25" y1="-100" x2="-25" y2="60" stroke="url(#l9Purple)" stroke-width="18" stroke-linecap="round" filter="url(#l9Glow)"/>

    <!-- Floating Modular Pixel Cubes below -->
    <rect x="-85" y="85" width="26" height="26" rx="5" fill="#38bdf8" filter="url(#l9Glow)"/>
    <rect x="-45" y="95" width="22" height="22" rx="4" fill="#00f0ff"/>
    <rect x="-10" y="85" width="24" height="24" rx="5" fill="#a855f7"/>
    <rect x="25" y="95" width="22" height="22" rx="4" fill="#38bdf8"/>
    <rect x="60" y="85" width="26" height="26" rx="5" fill="#00f0ff" filter="url(#l9Glow)"/>
  </g>

  <!-- Typography -->
  <text x="400" y="620" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="-1">PixelTo<tspan fill="#38bdf8">Cloud</tspan></text>
  <text x="400" y="665" font-family="'Fira Code', monospace" font-weight="600" font-size="18" fill="#94a3b8" text-anchor="middle" letter-spacing="3">CUSTOM SOFTWARE &amp; WEB PLATFORMS</text>
</svg>
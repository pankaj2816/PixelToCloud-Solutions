<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="l11Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d" />
      <stop offset="100%" stop-color="#0a1224" />
    </linearGradient>
    <linearGradient id="l11Cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="l11Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" rx="36" fill="url(#l11Bg)" />

  <g transform="translate(400, 340)">
    <!-- High-Impact Clean Cloud -->
    <path d="M -110 50 L 110 50 A 45 45 0 0 0 125 -25 A 55 55 0 0 0 15 -90 A 65 65 0 0 0 -95 -35 A 45 45 0 0 0 -110 50 Z" 
          fill="none" stroke="url(#l11Cyan)" stroke-width="12" filter="url(#l11Glow)"/>

    <!-- Internal Digital Grid of Pixels -->
    <g fill="#38bdf8" opacity="0.85">
      <rect x="-60" y="-15" width="18" height="18" rx="3"/>
      <rect x="-35" y="-15" width="18" height="18" rx="3"/>
      <rect x="-10" y="-15" width="18" height="18" rx="3"/>
      <rect x="15" y="-15" width="18" height="18" rx="3"/>
      <rect x="40" y="-15" width="18" height="18" rx="3"/>
      <rect x="-35" y="-40" width="18" height="18" rx="3"/>
      <rect x="-10" y="-40" width="18" height="18" rx="3" fill="#ffffff" filter="url(#l11Glow)"/>
      <rect x="15" y="-40" width="18" height="18" rx="3"/>
      <rect x="-10" y="-65" width="18" height="18" rx="3"/>
    </g>

    <!-- Mouse Pointer / Cursor Click clicking the cloud -->
    <g transform="translate(30, 10)">
      <!-- Ripple Click Waves -->
      <circle cx="0" cy="0" r="16" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.4"/>
      <!-- Cursor Arrow -->
      <polygon points="0,0 20,48 10,48 5,60 -5,56 0,44 -12,38" fill="#ffffff" stroke="#05070d" stroke-width="2.5" filter="url(#l11Glow)"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="400" y="620" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="-1">PixelTo<tspan fill="#38bdf8">Cloud</tspan></text>
  <text x="400" y="665" font-family="'Fira Code', monospace" font-weight="600" font-size="18" fill="#94a3b8" text-anchor="middle" letter-spacing="3">DIGITAL EXPERIENCES &amp; WEB APPS</text>
</svg>
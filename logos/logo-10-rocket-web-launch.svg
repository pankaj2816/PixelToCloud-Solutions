<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="l10Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#0c1222" />
    </linearGradient>
    <linearGradient id="l10Rocket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="l10Thrust" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="l10Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" rx="36" fill="url(#l10Bg)" />

  <g transform="translate(400, 340)">
    <!-- Background Cloud Layer -->
    <path d="M -150 40 L 150 40 A 50 50 0 0 0 165 -45 A 65 65 0 0 0 35 -120 A 75 75 0 0 0 -130 -60 A 55 55 0 0 0 -150 40 Z" 
          fill="rgba(14, 23, 42, 0.9)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2.5"/>

    <!-- Rocket Jet Plume of Digital Pixels -->
    <rect x="-12" y="55" width="24" height="24" rx="4" fill="url(#l10Thrust)" filter="url(#l10Glow)"/>
    <rect x="-24" y="85" width="20" height="20" rx="4" fill="#00f0ff"/>
    <rect x="4" y="85" width="20" height="20" rx="4" fill="#38bdf8"/>
    <rect x="-35" y="112" width="16" height="16" rx="3" fill="#818cf8"/>
    <rect x="-10" y="112" width="18" height="18" rx="3" fill="#00f0ff"/>
    <rect x="15" y="112" width="16" height="16" rx="3" fill="#38bdf8"/>

    <!-- Rocket Body -->
    <g transform="translate(0, -30)">
      <!-- Rocket Thruster Flame -->
      <polygon points="-16,50 0,85 16,50" fill="url(#l10Thrust)" filter="url(#l10Glow)"/>
      <!-- Rocket Wings -->
      <path d="M -38 40 L -18 10 L -18 45 Z" fill="#38bdf8"/>
      <path d="M 38 40 L 18 10 L 18 45 Z" fill="#38bdf8"/>
      <!-- Main Fuselage -->
      <path d="M -18 45 L -18 -10 Q -18 -70 0 -85 Q 18 -70 18 -10 L 18 45 Z" fill="url(#l10Rocket)"/>
      <!-- Rocket Window Portal (P2C Cyan Eye) -->
      <circle cx="0" cy="-20" r="10" fill="#07090e" stroke="#38bdf8" stroke-width="3"/>
      <circle cx="0" cy="-20" r="5" fill="#00f0ff" filter="url(#l10Glow)"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="400" y="620" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="-1">PixelTo<tspan fill="#38bdf8">Cloud</tspan></text>
  <text x="400" y="665" font-family="'Fira Code', monospace" font-weight="600" font-size="18" fill="#94a3b8" text-anchor="middle" letter-spacing="3">LAUNCH YOUR BUSINESS ONLINE</text>
</svg>
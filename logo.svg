<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="v2_CloudGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="v2_CyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="v2_SoftGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" rx="40" fill="#04060a" />

  <g transform="translate(400, 325)">
    <!-- Ambient Blue Halo behind Cloud -->
    <circle cx="10" cy="-20" r="100" fill="#0284c7" opacity="0.25" filter="url(#v2_SoftGlow)"/>

    <!-- Sculpted Cloud Body -->
    <path d="M -120 48 
             L 105 48 
             A 48 48 0 0 0 130 -32 
             A 62 62 0 0 0 20 -115 
             A 75 75 0 0 0 -105 -48 
             A 48 48 0 0 0 -120 48 Z" 
          fill="url(#v2_CloudGlass)"/>

    <!-- Specular Highlight Line on Top Arc -->
    <path d="M -90 -45 A 72 72 0 0 1 15 -110" 
          fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

    <!-- The Pixel Bite Notch revealing glowing cyan depth -->
    <g transform="translate(68, -75) rotate(22)">
      <rect x="-20" y="-20" width="40" height="40" rx="6" fill="#04060a"/>
      <rect x="-18" y="-18" width="36" height="36" rx="5" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
    </g>

    <!-- Floating Illuminated Cyan Pixel Core -->
    <g transform="translate(122, -112) rotate(22)" filter="url(#v2_SoftGlow)">
      <rect x="-17" y="-17" width="34" height="34" rx="8" fill="url(#v2_CyanGrad)"/>
      <rect x="-17" y="-17" width="34" height="34" rx="8" fill="none" stroke="#ffffff" stroke-width="2"/>
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(400, 580)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-weight="800" font-size="54" fill="#ffffff" text-anchor="middle" letter-spacing="-1.5">
      PixelTo<tspan fill="#38bdf8">Cloud</tspan>
    </text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-weight="600" font-size="15" fill="#64748b" text-anchor="middle" letter-spacing="4">
      HIGH-PERFORMANCE ENGINEERING
    </text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="p2cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="80%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0.4)"/>
      <stop offset="70%" stop-color="rgba(2, 132, 199, 0.1)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Frame with Rounded Tech Bevel -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="#060911" stroke="url(#p2cGrad)" stroke-width="3.5"/>
  <circle cx="64" cy="64" r="50" fill="url(#coreGlow)" />

  <!-- Quantum Grid Lines -->
  <line x1="24" y1="64" x2="104" y2="64" stroke="rgba(0, 240, 255, 0.12)" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="64" y1="24" x2="64" y2="104" stroke="rgba(0, 240, 255, 0.12)" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Golden Silicon Pin Accents -->
  <circle cx="28" cy="28" r="3" fill="url(#goldGrad)"/>
  <circle cx="100" cy="28" r="3" fill="url(#goldGrad)"/>
  <circle cx="28" cy="100" r="3" fill="url(#goldGrad)"/>
  <circle cx="100" cy="100" r="3" fill="url(#goldGrad)"/>

  <!-- Iconic Hexagonal Silicon Core -->
  <polygon points="64,28 92,44 92,76 64,92 36,76 36,44" fill="none" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1.5"/>

  <!-- P2C Stylized Monogram Glyph -->
  <path d="M 46 40 L 68 40 C 78 40 84 45 84 53 C 84 61 78 66 68 66 L 56 66 L 56 88 L 46 88 Z M 56 48 L 56 58 L 67 58 C 72 58 75 56 75 53 C 75 50 72 48 67 48 Z" fill="url(#p2cGrad)" filter="url(#glow)"/>

  <!-- Satellite Cloud Pulse Dot -->
  <circle cx="86" cy="80" r="4.5" fill="#00f0ff" filter="url(#glow)"/>
</svg>

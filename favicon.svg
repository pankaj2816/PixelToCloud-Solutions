<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="p2cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#00a3ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Rounded Frame -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="#080b11" stroke="url(#p2cGrad)" stroke-width="4"/>
  
  <!-- Subtle Internal Grid Glow -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="rgba(0, 240, 255, 0.15)" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- P2C Monogram -->
  <text x="64" y="78" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="900" font-size="44" fill="url(#p2cGrad)" text-anchor="middle" filter="url(#glow)" letter-spacing="-1">P2C</text>
</svg>

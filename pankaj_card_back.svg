<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="1050" height="600">
  <defs>
    <linearGradient id="cardBgBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0d111c" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <linearGradient id="cyanMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1050" height="600" rx="24" fill="url(#cardBgBack)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2"/>

  <!-- Top Center P2C Monogram -->
  <g transform="translate(525, 65)">
    <rect x="-30" y="-30" width="60" height="60" rx="14" fill="url(#cyanMetallic)" filter="url(#glow)"/>
    <text x="0" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="24" fill="#050b14" text-anchor="middle" letter-spacing="-0.5">P2C</text>
    <text x="0" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="26" fill="#ffffff" text-anchor="middle">PixelTo<tspan fill="#38bdf8">Cloud</tspan> Solutions</text>
    <text x="0" y="80" font-family="'Fira Code', monospace" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">FULL-STACK ENGINEERING &amp; ENTERPRISE CLOUD ARCHITECTURE</text>
  </g>

  <!-- 4 Core Service Bento Blocks -->
  <g transform="translate(70, 190)">
    <!-- Service Block 1 -->
    <g transform="translate(0, 0)">
      <rect width="430" height="85" rx="14" fill="rgba(13, 17, 28, 0.75)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2"/>
      <rect x="0" y="0" width="6" height="85" rx="3" fill="#38bdf8"/>
      <text x="24" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="17" fill="#ffffff">🛍️ Custom E-Commerce &amp; Web Apps</text>
      <text x="24" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Instant 0.4s load speed, WhatsApp checkout &amp; payments</text>
    </g>

    <!-- Service Block 2 -->
    <g transform="translate(480, 0)">
      <rect width="430" height="85" rx="14" fill="rgba(13, 17, 28, 0.75)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2"/>
      <rect x="0" y="0" width="6" height="85" rx="3" fill="#818cf8"/>
      <text x="24" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="17" fill="#ffffff">🧊 2D/3D WebGL Three.js Graphics</text>
      <text x="24" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Interactive 360° product customizers &amp; 60 FPS shaders</text>
    </g>

    <!-- Service Block 3 -->
    <g transform="translate(0, 105)">
      <rect width="430" height="85" rx="14" fill="rgba(13, 17, 28, 0.75)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2"/>
      <rect x="0" y="0" width="6" height="85" rx="3" fill="#10b981"/>
      <text x="24" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="17" fill="#ffffff">🩺 Doctor &amp; Clinic Telehealth Portals</text>
      <text x="24" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">In-browser video calling, appointments &amp; e-prescriptions</text>
    </g>

    <!-- Service Block 4 -->
    <g transform="translate(480, 105)">
      <rect width="430" height="85" rx="14" fill="rgba(13, 17, 28, 0.75)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2"/>
      <rect x="0" y="0" width="6" height="85" rx="3" fill="#f59e0b"/>
      <text x="24" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="17" fill="#ffffff">💼 CA FinTech &amp; Cloud DevOps</text>
      <text x="24" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">256-bit encrypted tax vault, Linux VPS, Docker &amp; DNS</text>
    </g>
  </g>

  <!-- Bottom Guarantees Strip -->
  <g transform="translate(70, 435)">
    <rect width="910" height="70" rx="14" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.2"/>
    <text x="45" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#38bdf8">🔐 100% Code Ownership</text>
    <text x="310" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#10b981">⚡ 0.4s Sub-Second Speed</text>
    <text x="590" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#fbbf24">🚫 $0 Monthly Platform Rent</text>
  </g>

  <!-- Bottom URL -->
  <text x="525" y="555" font-family="'Fira Code', monospace" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">https://pixeltocloud.com</text>
</svg>
      <g transform="translate(122, -112) rotate(22)"><rect x="-17" y="-17" width="34" height="34" rx="8" fill="#00f0ff" stroke="#fff" stroke-width="3"/></g>
    </g>
    <text x="0" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="26" fill="#ffffff" text-anchor="middle">PixelTo<tspan fill="#38bdf8">Cloud</tspan> Solutions</text>
    <text x="0" y="90" font-family="'Fira Code', monospace" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">FULL-STACK ENGINEERING &amp; ENTERPRISE CLOUD ARCHITECTURE</text>
  </g>


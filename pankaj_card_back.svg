<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="1050" height="600">
  <defs>
    <linearGradient id="cardBgBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0d111c" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <linearGradient id="cyanMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1050" height="600" rx="24" fill="url(#cardBgBack)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2"/>

    <!-- Official Pixel Bite Top Center Emblem -->
  <g transform="translate(525, 55)">
    <rect x="-32" y="-32" width="64" height="64" rx="16" fill="#04060a" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    <g transform="translate(0, 8) scale(0.18)">
      <circle cx="10" cy="-20" r="95" fill="#0284c7" opacity="0.3"/>
      <path d="M -120 48 L 105 48 A 48 48 0 0 0 130 -32 A 62 62 0 0 0 20 -115 A 75 75 0 0 0 -105 -48 A 48 48 0 0 0 -120 48 Z" fill="url(#cyanMetallic)"/>

      <rect x="0" y="0" width="6" height="85" rx="3" fill="#38bdf8"/>
      <text x="24" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="17" fill="#ffffff">🛍️ Custom E-Commerce &amp; Web Apps</text>
      <text x="24" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Instant 0.4s load speed, WhatsApp checkout &amp; payments</text>
